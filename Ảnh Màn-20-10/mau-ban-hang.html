<title>Mẫu ảnh bán hàng - ASL Workshop</title>

<!--
  Mẫu ảnh bán hàng nền trắng 1920x1080 cho ASL Workshop.
  Mở file với ?m=<mã> để xem từng màn, ví dụ: mau-ban-hang.html?m=g274qpx
  Sửa nội dung / giá trong biến MODELS bên dưới.
-->
<style>
  :root{
    --navy:#0a2a6b; --navy2:#16408f; --red:#d0102e; --yellow:#ffc21a;
    --ink:#14213d; --text:#3d4a63; --muted:#7a869c; --soft:#f2f5fb; --line:#e3e8f2; --green:#16a34a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;overflow:hidden}
  body{font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--ink);background:#fff;position:relative}
  .blob1{position:absolute;left:-180px;top:120px;width:1100px;height:900px;border-radius:50%;
    background:radial-gradient(closest-side,#e6eeff 0%,#f3f7ff 55%,rgba(255,255,255,0) 100%)}

  .wrap{position:relative;height:100%;display:flex;flex-direction:column;padding:34px 70px 0 60px}

  header{display:flex;align-items:center;justify-content:space-between;height:90px}
  header img{height:74px}
  .chips{display:flex;gap:14px}
  .chip{display:flex;align-items:center;gap:10px;padding:12px 22px;border-radius:999px;font-weight:800;font-size:20px}
  .chip.used{background:#fff4f5;color:var(--red);border:2px solid #f6c6cd}
  .chip.wty{background:var(--navy);color:#fff;font-size:21px}
  .chip svg{width:22px;height:22px}

  main{flex:1;display:grid;grid-template-columns:880px 1fr;gap:30px;padding-top:6px}

  .prod{position:relative}
  .prod .disc{position:absolute;left:230px;top:30px;width:620px;height:620px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#ffffff 0%,#e8efff 70%,#dce6fb 100%);box-shadow:inset 0 0 0 10px rgba(255,255,255,.7)}
  .prod .pimg{position:absolute;left:130px;top:10px;width:820px;height:660px;object-fit:contain;filter:drop-shadow(0 30px 30px rgba(10,42,107,.22))}
  /* 4 thông số chính xếp thành cột bên trái ảnh */
  #bubbles{position:absolute;left:0;top:20px;display:flex;flex-direction:column;gap:22px}
  .bubble{width:136px;height:136px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#fff;box-shadow:0 14px 30px rgba(10,42,107,.22);border:5px solid #fff;text-align:center}
  .bubble b{font-size:42px;font-weight:900;line-height:1}
  .bubble b small{font-size:20px}
  .bubble span{font-size:15px;font-weight:700;margin-top:4px;opacity:.95}
  .bubble:nth-child(odd){background:var(--navy)}
  .bubble:nth-child(even){background:var(--red)}

  .fit{position:absolute;left:0;right:0;bottom:22px}
  .fit h4{font-size:19px;font-weight:800;color:var(--muted);letter-spacing:2px;margin-bottom:12px}
  .fit .row{display:flex;gap:10px;flex-wrap:nowrap}
  .fit .it{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:11px 14px;white-space:nowrap;
    font-size:18px;font-weight:700;color:var(--ink);box-shadow:0 6px 16px rgba(10,42,107,.06)}
  .fit .it i{font-style:normal;font-size:21px}

  .eyebrow{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:18px;letter-spacing:2px;padding:7px 16px;border-radius:8px}
  h1{font-size:84px;font-weight:900;color:var(--navy);line-height:1;margin:14px 0 10px;letter-spacing:-1px;white-space:nowrap}
  .lead{font-size:26px;color:var(--text);font-weight:500;line-height:1.4}
  .lead b{color:var(--ink);font-weight:800}

  .why{margin-top:22px}
  .why h3{font-size:24px;font-weight:900;color:var(--ink);margin-bottom:12px}
  .why h3 span{color:var(--red)}
  .why ul{list-style:none;display:flex;flex-direction:column;gap:11px}
  .why li{display:flex;align-items:flex-start;gap:14px;font-size:20.5px;color:var(--text);line-height:1.35}
  .why li .ck{flex:none;width:30px;height:30px;border-radius:50%;background:#e9f8ef;display:grid;place-items:center;margin-top:1px}
  .why li .ck svg{width:18px;height:18px;stroke:var(--green);stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .why li b{color:var(--ink);font-weight:800}

  .spec{margin-top:20px;background:var(--soft);border-radius:18px;padding:14px 24px;display:grid;grid-template-columns:1fr 1fr;column-gap:30px}
  .spec .r{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:17px}
  .spec .r:nth-last-child(-n+2){border-bottom:none}
  .spec dt{color:var(--muted);font-weight:500;white-space:nowrap}
  .spec dd{font-weight:700;color:var(--ink);text-align:right}

  /* footer: giá | liên hệ | địa chỉ */
  footer{margin:0 -70px 0 -60px;height:150px;background:var(--navy);display:grid;grid-template-columns:660px 1fr 520px;color:#fff}
  .price{background:var(--red);display:flex;align-items:center;gap:22px;padding-left:60px;clip-path:polygon(0 0,100% 0,91% 100%,0 100%)}
  .price .tag{width:70px;height:70px;flex:none}
  .price .k{font-size:19px;font-weight:800;letter-spacing:2px;color:#ffe08a}
  .price .v{font-size:68px;font-weight:900;line-height:1;color:var(--yellow);letter-spacing:-.5px;margin:2px 0 4px}
  .price .v small{font-size:46px;margin-left:4px}
  .price .s{font-size:21px;font-weight:700;color:#fff}
  .price .s b{color:var(--yellow);font-weight:900}
  .c{display:flex;align-items:center;gap:20px;padding-left:8px}
  .c .ic{width:74px;height:74px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;flex:none;box-shadow:0 0 0 8px rgba(255,194,26,.2)}
  .c .ic svg{width:36px;height:36px;fill:var(--navy)}
  .c .who{font-size:20px;font-weight:600;color:#c9d5f0}
  .c .who b{color:#fff;font-weight:800}
  .c .num{font-size:54px;font-weight:900;line-height:1.05;letter-spacing:1px;white-space:nowrap}
  .c .num span{color:var(--yellow)}
  .a{display:flex;align-items:center;justify-content:flex-end;gap:18px;padding-right:70px;border-left:1px solid rgba(255,255,255,.15)}
  .a svg{width:46px;height:46px;flex:none;stroke:var(--yellow);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .a .k{font-size:18px;font-weight:600;letter-spacing:1px;color:#c9d5f0}
  .a .v{font-size:30px;font-weight:800;line-height:1.15}
</style>
</head>
